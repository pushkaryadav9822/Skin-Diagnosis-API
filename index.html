<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Diagnosis Model API Tester</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 sm:p-8">

    <div class="max-w-xl mx-auto bg-white shadow-2xl rounded-xl p-6 sm:p-10 border border-gray-200">
        <h1 class="text-3xl font-extrabold text-indigo-700 mb-4">
            Skin Diagnosis API Tester
        </h1>
        <p class="text-gray-600 mb-6">Upload an image to get a prediction from your trained MobileNetV2 model.</p>

        <!-- File Upload Form -->
        <form id="uploadForm" enctype="multipart/form-data" class="space-y-6">
            <div class="flex flex-col items-center justify-center border-2 border-dashed border-indigo-300 rounded-lg p-8 cursor-pointer hover:border-indigo-500 transition duration-300">
                <input type="file" id="imageFile" name="file" accept="image/*" required class="hidden" onchange="previewImage(event)">
                <label for="imageFile" class="text-indigo-600 font-semibold cursor-pointer">
                    <svg class="w-8 h-8 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 16m-7-6h.01M5 21V5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3-7 3z"></path></svg>
                    <span>Click here to select an image</span>
                </label>
            </div>
            
            <div id="imagePreviewContainer" class="hidden">
                <p class="text-sm text-gray-500 mb-2">Image Preview:</p>
                <img id="imagePreview" class="w-full h-auto max-h-64 object-contain rounded-lg shadow-md border border-gray-300" src="" alt="Image Preview">
            </div>

            <button type="submit" 
                    id="submitButton" 
                    class="w-full py-3 bg-indigo-600 text-white font-bold rounded-lg shadow-md hover:bg-indigo-700 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
                Get Prediction
            </button>
        </form>

        <!-- Prediction Result Display -->
        <div id="resultContainer" class="mt-8 pt-6 border-t border-gray-200 hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Prediction Result</h2>
            
            <div class="bg-indigo-50 p-4 rounded-lg border-l-4 border-indigo-500">
                <p class="text-lg text-gray-700 mb-1">Result: <span id="predictionResult" class="font-extrabold text-indigo-800"></span></p>
                <p class="text-sm text-gray-600">Confidence: <span id="confidenceResult" class="font-medium text-indigo-700"></span></p>
            </div>
        </div>

        <!-- Loading/Error Message -->
        <div id="messageBox" class="mt-4 p-3 rounded-lg text-sm hidden" role="alert"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('imageFile');
        const resultContainer = document.getElementById('resultContainer');
        const predictionResult = document.getElementById('predictionResult');
        const confidenceResult = document.getElementById('confidenceResult');
        const messageBox = document.getElementById('messageBox');
        const imagePreview = document.getElementById('imagePreview');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const submitButton = document.getElementById('submitButton');

        function showMessage(text, type = 'info') {
            messageBox.textContent = text;
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-blue-100', 'text-blue-700');
            
            if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'text-red-700');
            } else if (type === 'success') {
                messageBox.classList.add('bg-green-100', 'text-green-700');
            } else {
                messageBox.classList.add('bg-blue-100', 'text-blue-700');
            }
            messageBox.classList.remove('hidden');
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreviewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                imagePreviewContainer.classList.add('hidden');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            resultContainer.classList.add('hidden');
            messageBox.classList.add('hidden');
            submitButton.disabled = true;
            submitButton.textContent = 'Predicting...';
            
            if (!fileInput.files.length) {
                showMessage('Please select an image file.', 'error');
                submitButton.disabled = false;
                submitButton.textContent = 'Get Prediction';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    predictionResult.textContent = data.prediction;
                    confidenceResult.textContent = data.confidence;
                    resultContainer.classList.remove('hidden');
                    showMessage('Prediction successful!', 'success');
                } else {
                    showMessage(`API Error: ${data.error || response.statusText}`, 'error');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                showMessage('Network Error: Could not connect to the API.', 'error');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Get Prediction';
            }
        });
    </script>
</body>
</html>
